name: Cube app
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cube-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cube:
    if: github.repository == 'collabs-inc/cube-orca'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Install exactly as Cube does
        run: node cube/install.mjs
      - name: Gateway and lifecycle tests
        run: cube/tools/node/bin/node --test cube/*.test.mjs
      - name: Upstream web pairing and runtime contracts
        run: >-
          cube/tools/node/bin/node node_modules/vitest/vitest.mjs run
          --config config/vitest.config.ts --maxWorkers=1
          src/renderer/src/web/web-preload-api-runtime-environment.test.ts
          src/renderer/src/web/web-preload-api-runtime-calls.test.ts
          src/main/codex-cli/command.test.ts
          src/renderer/src/components/status-bar/mergeSnapshotAndSessions.test.ts
          src/renderer/src/components/status-bar/use-resource-usage-derived-model.test.tsx
          src/main/runtime/rpc/methods/floating-terminal-directory.test.ts
          src/main/ipc/floating-workspace-directory.test.ts
          src/renderer/src/components/onboarding/OnboardingInlineCommandTerminal.command-finished.test.tsx
      - name: Install browser for acceptance
        run: cube/tools/node/bin/node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Real runtime and web acceptance
        run: cube/tools/node/bin/node cube/smoke.mjs --browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cube-browser-evidence
          path: |
            cube-smoke.png
            cube-onboarding.png
          if-no-files-found: ignore
