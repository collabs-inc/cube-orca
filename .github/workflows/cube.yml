name: Cube app
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cube-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cube:
    if: github.repository == 'collabs-inc/cube-orca'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Install exactly as Cube does
        run: node cube/install.mjs
      - name: Gateway and lifecycle tests
        run: cube/tools/node/bin/node --test cube/*.test.mjs
      - name: Install browser for acceptance
        run: cube/tools/node/bin/node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Real runtime and web acceptance
        run: cube/tools/node/bin/node cube/smoke.mjs --browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cube-browser-evidence
          path: cube-smoke.png
          if-no-files-found: ignore
